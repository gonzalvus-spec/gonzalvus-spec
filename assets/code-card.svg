<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">Perfil profesional de Félix Gonzalo Falcón Llanos en TypeScript</title>
  <desc id="desc">Tarjeta de código animada con la paleta borgoña oscura del perfil.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#160C11"/>
      <stop offset="1" stop-color="#2A1018"/>
    </linearGradient>

    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#541B2A"/>
      <stop offset="0.55" stop-color="#922D40"/>
      <stop offset="1" stop-color="#C5A477"/>
    </linearGradient>

    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1116"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#922D40" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#922D40" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="l1"><rect x="58" y="77" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.34s" begin="0.25s" fill="freeze"/></rect></clipPath>
