    </g>

    <g clip-path="url(#l6)">
      <text x="68" y="217"><tspan fill="#D8C8B5">  stack</tspan><tspan fill="#8A6A72">: {</tspan></text>
    </g>

    <g clip-path="url(#l7)">
      <text x="68" y="242"><tspan fill="#D8C8B5">    sistemas</tspan><tspan fill="#8A6A72">: [</tspan><tspan fill="#D9A98F">"Rust"</tspan><tspan fill="#8A6A72">, </tspan><tspan fill="#D9A98F">"Tauri"</tspan><tspan fill="#8A6A72">],</tspan></text>
    </g>

    <g clip-path="url(#l8)">
      <text x="68" y="267"><tspan fill="#D8C8B5">    web</tspan><tspan fill="#8A6A72">: [</tspan><tspan fill="#D9A98F">"React"</tspan><tspan fill="#8A6A72">, </tspan><tspan fill="#D9A98F">"TypeScript"</tspan><tspan fill="#8A6A72">],</tspan></text>
    </g>

    <g clip-path="url(#l9)">
      <text x="68" y="292"><tspan fill="#D8C8B5">    movil</tspan><tspan fill="#8A6A72">: [</tspan><tspan fill="#D9A98F">"Flutter"</tspan><tspan fill="#8A6A72">, </tspan><tspan fill="#D9A98F">"Dart"</tspan><tspan fill="#8A6A72">],</tspan></text>
    </g>

    <g clip-path="url(#l10)">
      <text x="68" y="317"><tspan fill="#D8C8B5">    datos</tspan><tspan fill="#8A6A72">: [</tspan><tspan fill="#D9A98F">"MongoDB"</tspan><tspan fill="#8A6A72">],</tspan></text>
    </g>

    <g clip-path="url(#l11)">
      <text x="68" y="342"><tspan fill="#8A6A72">  },</tspan></text>
    </g>

    <g clip-path="url(#l12)">
      <text x="68" y="367"><tspan fill="#D8C8B5">  entorno</tspan><tspan fill="#8A6A72">: [</tspan><tspan fill="#D9A98F">"Debian"</tspan><tspan fill="#8A6A72">, </tspan><tspan fill="#D9A98F">"CachyOS"</tspan><tspan fill="#8A6A72">, </tspan><tspan fill="#D9A98F">"Windows 11"</tspan><tspan fill="#8A6A72">],</tspan></text>
    </g>

    <g clip-path="url(#l13)">
      <text x="68" y="392"><tspan fill="#D8C8B5">  estado</tspan><tspan fill="#8A6A72">: </tspan><tspan fill="#D9A98F">"Construyendo software fiable"</tspan><tspan fill="#8A6A72">,</tspan></text>
    </g>

    <g clip-path="url(#l14)">
      <text x="68" y="417"><tspan fill="#8A6A72">} </tspan><tspan fill="#C5A477">as const</tspan><tspan fill="#8A6A72">;</tspan></text>
    </g>
  </g>

  <!-- Cursor parpadeante -->
  <rect x="68" y="427" width="9" height="17" fill="#C5A477">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" begin="3.7s" repeatCount="indefinite"/>
  </rect>

  <!-- Pie de la tarjeta -->
  <text x="96" y="440" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6B4A52">build: passing · 2026</text>
  <text x="794" y="440" text-anchor="end" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6B4A52">UTF-8 · LF · TypeScript</text>
