    <clipPath id="l4"><rect x="58" y="152" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.40s" begin="1.18s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="58" y="177" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.44s" begin="1.42s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="58" y="202" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.26s" begin="1.70s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="58" y="227" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.34s" begin="1.82s" fill="freeze"/></rect></clipPath>
    <clipPath id="l8"><rect x="58" y="252" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.40s" begin="2.02s" fill="freeze"/></rect></clipPath>
    <clipPath id="l9"><rect x="58" y="277" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.38s" begin="2.28s" fill="freeze"/></rect></clipPath>
    <clipPath id="l10"><rect x="58" y="302" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.28s" begin="2.52s" fill="freeze"/></rect></clipPath>
    <clipPath id="l11"><rect x="58" y="327" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.20s" begin="2.66s" fill="freeze"/></rect></clipPath>
    <clipPath id="l12"><rect x="58" y="352" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.52s" begin="2.74s" fill="freeze"/></rect></clipPath>
    <clipPath id="l13"><rect x="58" y="377" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.44s" begin="3.12s" fill="freeze"/></rect></clipPath>
