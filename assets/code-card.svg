      <text x="42" y="117">2</text>
      <text x="42" y="142">3</text>
      <text x="42" y="167">4</text>
      <text x="42" y="192">5</text>
      <text x="42" y="217">6</text>
      <text x="42" y="242">7</text>
      <text x="42" y="267">8</text>
      <text x="42" y="292">9</text>
      <text x="42" y="317">10</text>
      <text x="42" y="342">11</text>
      <text x="42" y="367">12</text>
      <text x="42" y="392">13</text>
      <text x="42" y="417">14</text>
    </g>

    <g clip-path="url(#l1)">
      <text x="68" y="92"><tspan fill="#C5A477">const</tspan><tspan fill="#E9D9C5"> gonzalo</tspan><tspan fill="#8A6A72"> = {</tspan></text>
    </g>

    <g clip-path="url(#l2)">
      <text x="68" y="117"><tspan fill="#D8C8B5">  nombre</tspan><tspan fill="#8A6A72">: </tspan><tspan fill="#D9A98F">"Félix Gonzalo Falcón Llanos"</tspan><tspan fill="#8A6A72">,</tspan></text>
    </g>

    <g clip-path="url(#l3)">
      <text x="68" y="142"><tspan fill="#D8C8B5">  rol</tspan><tspan fill="#8A6A72">: [</tspan><tspan fill="#D9A98F">"Facturación electrónica"</tspan><tspan fill="#8A6A72">, </tspan><tspan fill="#D9A98F">"Soporte técnico"</tspan><tspan fill="#8A6A72">],</tspan></text>
    </g>

    <g clip-path="url(#l4)">
      <text x="68" y="167"><tspan fill="#D8C8B5">  empresa</tspan><tspan fill="#8A6A72">: </tspan><tspan fill="#D9A98F">"RUBRIFACT S.A.C."</tspan><tspan fill="#8A6A72">,</tspan></text>
    </g>

