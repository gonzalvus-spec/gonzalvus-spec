  <!-- Marco -->
  <rect x="0.5" y="0.5" width="819" height="459" rx="16" fill="url(#bg)" stroke="#3A1A24"/>
  <rect x="0" y="0" width="820" height="3" fill="url(#topbar)" rx="1.5"/>

  <!-- Resplandor ambiental -->
  <ellipse cx="700" cy="40" rx="240" ry="150" fill="url(#ambient)"/>

  <!-- Barra de ventana -->
  <path d="M0 16a16 16 0 0 1 16-16h788a16 16 0 0 1 16 16v36H0z" fill="url(#tab)"/>
  <circle cx="28" cy="28" r="6" fill="#922D40"/>
  <circle cx="52" cy="28" r="6" fill="#C5A477"/>
  <circle cx="76" cy="28" r="6" fill="#541B2A"/>

  <text x="110" y="33" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#8A6A72">gonzalo.ts</text>
  <rect x="330" y="18" width="150" height="22" rx="6" fill="#1D1116" stroke="#3A1A24"/>
  <text x="348" y="33" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#C5A477">perfil — 2026</text>

  <line x1="0" y1="52" x2="820" y2="52" stroke="#2A1218"/>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" xml:space="preserve">
