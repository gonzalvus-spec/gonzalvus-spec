<svg xmlns="http://www.w3.org/2000/svg" width="240" height="280" viewBox="0 0 240 280" role="img" aria-labelledby="title desc">
  <title id="title">RubriPost — icono animado</title>
  <desc id="desc">Comprobante electrónico animado con la paleta Monokai y sello rubí.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272822"/>
      <stop offset="1" stop-color="#1B1C18"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E3D32"/>
      <stop offset="1" stop-color="#33332B"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F92672"/>
      <stop offset="1" stop-color="#FD971F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F92672" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F92672" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="239" height="279" rx="18" fill="url(#bg)" stroke="#3E3D32"/>
  <rect x="0" y="0" width="240" height="3" rx="1.5" fill="url(#ruby)"/>

  <ellipse cx="120" cy="120" rx="120" ry="95" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Comprobante -->
  <rect x="78" y="40" width="84" height="128" rx="7" fill="url(#paper)" stroke="#4E4D43"/>
  <rect x="78" y="40" width="84" height="5" rx="2.5" fill="url(#ruby)"/>

  <rect x="90" y="60" width="60" height="5" rx="2.5" fill="#F8F8F2" opacity="0.85">
    <animate attributeName="opacity" values="0;0.85" dur="0.3s" begin="0.3s" fill="freeze"/>
  </rect>
  <rect x="90" y="76" width="46" height="4" rx="2" fill="#75715E">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.55s" fill="freeze"/>
  </rect>
  <rect x="90" y="90" width="52" height="4" rx="2" fill="#75715E">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.72s" fill="freeze"/>
  </rect>
  <rect x="90" y="104" width="38" height="4" rx="2" fill="#75715E">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.88s" fill="freeze"/>
  </rect>
  <rect x="90" y="118" width="30" height="4" rx="2" fill="#66D9EF">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.05s" fill="freeze"/>
  </rect>
  <rect x="90" y="134" width="60" height="5" rx="2.5" fill="#E6DB74">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.22s" fill="freeze"/>
  </rect>

  <!-- Sello rubí -->
  <circle cx="163" cy="150" r="18" fill="url(#ruby)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M156 150l5 5 10-11" fill="none" stroke="#272822" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 30;30 0" dur="0.4s" begin="1.9s" fill="freeze"/>
  </path>
  <circle cx="163" cy="150" r="18" fill="none" stroke="#F92672" stroke-width="2">
    <animate attributeName="r" values="18;30" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Marca -->
  <text x="120" y="212" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="20" font-weight="600" fill="#F8F8F2">Rubri<tspan fill="#F92672">Post</tspan></text>
  <text x="120" y="234" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#75715E">facturación electrónica</text>
  <text x="120" y="256" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#A6E22E">rust · tauri · mongodb</text>
</svg>
