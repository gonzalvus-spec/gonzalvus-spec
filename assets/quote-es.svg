<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180" role="img" aria-labelledby="title desc">
  <title id="title">Cita de ingeniería de software en español — tema Monokai</title>
  <desc id="desc">Bloque de comentario con una cita sobre ingeniería, en colores Monokai.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#272822"/>
      <stop offset="1" stop-color="#1E1F1C"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F92672"/>
      <stop offset="1" stop-color="#FD971F"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="179" rx="14" fill="url(#bg)" stroke="#3E3D32"/>
  <rect x="0" y="14" width="4" height="152" rx="2" fill="url(#side)"/>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" xml:space="preserve">
    <text x="34" y="46" font-size="13" fill="#75715E">/**</text>
    <text x="34" y="78" font-size="17"><tspan fill="#75715E"> * </tspan><tspan fill="#E6DB74">"Primero hazlo funcionar, luego hazlo bien,</tspan></text>
    <text x="34" y="106" font-size="17"><tspan fill="#75715E"> *  </tspan><tspan fill="#E6DB74">luego hazlo rápido."</tspan></text>
    <text x="34" y="138" font-size="13"><tspan fill="#75715E"> */</tspan><tspan fill="#75715E">  — </tspan><tspan fill="#F92672">Kent Beck</tspan></text>
    <text x="786" y="46" text-anchor="end" font-size="11" fill="#75715E">quote-es.md</text>
    <text x="786" y="138" text-anchor="end" font-size="11" fill="#A6E22E">monokai</text>
  </g>
</svg>
