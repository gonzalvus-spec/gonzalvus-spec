<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="title desc">
  <title id="title">Terminal animada con comandos de compilación</title>
  <desc id="desc">Terminal de desarrollo en la paleta borgoña oscura del perfil, con compilación de ejemplo.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#170C11"/>
      <stop offset="1" stop-color="#2A1018"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#541B2A"/>
      <stop offset="0.55" stop-color="#922D40"/>
      <stop offset="1" stop-color="#C5A477"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#541B2A"/>
      <stop offset="1" stop-color="#C5A477"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#922D40" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#922D40" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="t1"><rect x="30" y="72" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.3s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="30" y="102" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.5s" begin="0.65s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="30" y="132" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.22s" begin="1.25s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="30" y="162" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.42s" begin="1.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="30" y="192" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.36s" begin="1.95s" fill="freeze"/></rect></clipPath>
    <clipPath id="t6"><rect x="30" y="222" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.3s" begin="2.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="t7"><rect x="30" y="252" width="0" height="22"><animate attributeName="width" from="0" to="760" dur="0.44s" begin="2.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="329" rx="16" fill="url(#bg)" stroke="#3A1A24"/>
  <rect x="0" y="0" width="820" height="3" fill="url(#topbar)" rx="1.5"/>
  <ellipse cx="120" cy="300" rx="220" ry="130" fill="url(#ambient)"/>

  <!-- Barra de ventana -->
  <path d="M0 16a16 16 0 0 1 16-16h788a16 16 0 0 1 16 16v22H0z" fill="#1D1116"/>
  <circle cx="26" cy="20" r="5" fill="#922D40"/>
  <circle cx="46" cy="20" r="5" fill="#C5A477"/>
  <circle cx="66" cy="20" r="5" fill="#541B2A"/>
  <text x="410" y="25" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#8A6A72">gonzalo@rubrifact: ~/andesguard</text>
  <line x1="0" y1="38" x2="820" y2="38" stroke="#2A1218"/>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="13.5" xml:space="preserve">
    <g clip-path="url(#t1)">
      <text x="30" y="88"><tspan fill="#C5A477">gonzalo@rubrifact</tspan><tspan fill="#8A6A72">:</tspan><tspan fill="#922D40">~</tspan><tspan fill="#E9D9C5">$ whoami</tspan></text>
    </g>
    <g clip-path="url(#t2)">
      <text x="30" y="118" fill="#D8C8B5">félix gonzalo falcón llanos · ingeniería de sistemas</text>
    </g>
    <g clip-path="url(#t3)">
      <text x="30" y="148"><tspan fill="#C5A477">gonzalo@rubrifact</tspan><tspan fill="#8A6A72">:</tspan><tspan fill="#922D40">~</tspan><tspan fill="#E9D9C5">$ cargo build --release</tspan></text>
    </g>
    <g clip-path="url(#t4)">
      <text x="30" y="178"><tspan fill="#8A6A72">   Compiling </tspan><tspan fill="#D8C8B5">andesguard</tspan><tspan fill="#6B4A52"> v0.1.0</tspan><tspan fill="#6B4A52"> (/home/gonzalo/andesguard)</tspan></text>
    </g>
    <g clip-path="url(#t5)">
      <text x="30" y="208"><tspan fill="#6B4A52">    Finished </tspan><tspan fill="#C5A477">release [optimized]</tspan><tspan fill="#6B4A52"> target(s) in 2.41s</tspan></text>
    </g>
    <g clip-path="url(#t6)">
      <text x="30" y="238"><tspan fill="#C5A477">gonzalo@rubrifact</tspan><tspan fill="#8A6A72">:</tspan><tspan fill="#922D40">~</tspan><tspan fill="#E9D9C5">$ ./andesguard --serve</tspan></text>
    </g>
    <g clip-path="url(#t7)">
      <text x="30" y="268"><tspan fill="#6B4A52">  </tspan><tspan fill="#D8C8B5">listening on</tspan><tspan fill="#C5A477"> http://127.0.0.1:8080</tspan></text>
    </g>
  </g>

  <!-- Barra de progreso animada -->
  <rect x="30" y="286" width="220" height="5" rx="2.5" fill="#241018"/>
  <rect x="30" y="286" width="0" height="5" rx="2.5" fill="url(#progress)">
    <animate attributeName="width" from="0" to="220" dur="1.6s" begin="1.9s" fill="freeze"/>
  </rect>

  <!-- Cursor -->
  <rect x="30" y="300" width="9" height="16" fill="#C5A477">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" begin="3.1s" repeatCount="indefinite"/>
  </rect>
</svg>
